name: Radar (günlük tarama + kadro)

# T3 (docs/RADAR_V1.md §2, §4, §5): her gün 00:37 UTC (03:37 TSİ) T2 taraması (aday = radar_aday_tavan = 300, 7 gün getiriye göre; K-31) → R2 form puanı → kadro.
# Salt okunur halka açık Hyperliquid verisi; secret YOK. Çıktı veri dalı `radar` (kök commit yalnız ilk koşuda; sonra tarihli klasör eklenir, 90 gün tutulur):
#   radar/<tarih>/{havuz,kadro}.json  +  radar/son/kadro.json  (T4 motoru `son/kadro.json`'u okur).
# Eksik koşuda (zaman bütçesi aşıldı / satır eksik) `radar_kadro` çıkış kodu 2 verir → iş kırmızı biter ve `son/` GÜNCELLENMEZ. Hata örtülmez (başarısızlık gizlenmez).
# `kural_ust` / `aday_sayisi` girdisi YOK (donmuş kurallar; deneme `radar_deneme.yml`'de).
# Dal doğrulaması: `copytrade/radar/CALISTIR` dosyasına satır eklenen push (main dışı dal) AYNI iş akışını koşturur ama veri dalı `radar-deneme`'ye yazar (gerçek `radar` dalı yalnız main'den dokunulur).
on:
  schedule:
    - cron: "37 0 * * *"
    - cron: "17 2 * * *"            # YEDEK (T6 §4): 2026-11-05'te birincil cron hiç tetiklenmedi; o günün radar/<tarih>/ klasörü varsa iş hiçbir şey yapmadan biter
  workflow_dispatch:
  push:
    paths:
      - copytrade/radar/CALISTIR

permissions:
  contents: write

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  # S-19 (denetim 08.11): grup ref'e bağlı; dal deneme push'u main koşusunu (bekleyen) yerinden edip iptal ettiremez (11-04 olayı). Üretim (main) grubu adı değişmedi.
  group: ${{ github.ref == 'refs/heads/main' && 'radar' || format('radar-deneme-{0}', github.ref_name) }}
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      atla: ${{ steps.k.outputs.atla }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: k
        name: Zamanlama kontrolü (yedek cron)
        env:
          VERI_DALI: ${{ github.ref == 'refs/heads/main' && 'radar' || 'radar-deneme' }}
          ZAMANLAMA: ${{ github.event.schedule }}
          YEDEK_CRON: "17 2 * * *"
        run: bash .github/scripts/zamanlama_kontrol.sh radar
  radar:
    needs: kontrol
    if: ${{ needs.kontrol.outputs.atla != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Radar taraması (R0 + R1 + R2 girdileri)
        run: |
          mkdir -p radar
          python -u -m copytrade.radar_tarama --cikti radar --ozet-md radar/OZET.md
      - name: Günlük kadro (R2 form puanı)
        env:
          VERI_DALI: ${{ github.ref == 'refs/heads/main' && 'radar' || 'radar-deneme' }}
        run: |
          havuz="$(ls radar/*/havuz.json | tail -n 1)"
          # Yalnız bilgi alanları (elenenler, eski_uye_neden): önceki kadro = veri dalındaki son/kadro.json (bugünkü yayından önce). Dal/dosya yoksa (ilk koşu) argümansız; seçim etkilenmez.
          onceki=()
          if git cat-file -e "origin/$VERI_DALI:radar/son/kadro.json" 2>/dev/null; then
            git show "origin/$VERI_DALI:radar/son/kadro.json" > "$RUNNER_TEMP/onceki_kadro.json"
            onceki=(--onceki-kadro "$RUNNER_TEMP/onceki_kadro.json")
          fi
          python -u -m copytrade.radar_kadro --havuz "$havuz" "${onceki[@]}"
      - name: Seçim isabeti (§7b)
        env:
          VERI_DALI: ${{ github.ref == 'refs/heads/main' && 'radar' || 'radar-deneme' }}
        run: |
          # 7 gün önceki havuz+kadro (veri dalından) için arada geçen 7 günün kopya getirisi; en çok 30 dk, hata tarama işini bozmaz (eksik yazılır). İlk ölçüm 2026-11-12.
          python -u -m copytrade.radar_isabet --cikti radar --veri-dali "$VERI_DALI" --ozet-md radar/ISABET_OZET.md
      - name: Özet
        if: ${{ always() && hashFiles('radar/OZET.md') != '' }}
        run: |
          cat radar/OZET.md >> "$GITHUB_STEP_SUMMARY"
          if [ -s radar/ISABET_OZET.md ]; then cat radar/ISABET_OZET.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: radar-havuz-kadro
          path: radar
          if-no-files-found: ignore
      - name: Veri dalına yaz (radar)
        env:
          VERI_DALI: ${{ github.ref == 'refs/heads/main' && 'radar' || 'radar-deneme' }}
        run: bash .github/scripts/radar_yayimla.sh
