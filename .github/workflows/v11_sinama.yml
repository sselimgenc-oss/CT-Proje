name: v1.1 aday sınaması (yalnız bilgi)

# DENETIM_SECIM_2026-11-08 §3 / K-47: v1.1 adaylarını kayıtlı havuzlarla geriye dönük sınar (`copytrade/v11_sinama.py`). Salt okunur, secret YOK, veri dallarına YAZMAZ;
# kurallar ve motor değişmez. Çıktı: iş özeti + artifact. Elle (tarihler girdisi) ya da push: `copytrade/v11_sinama/CALISTIR` son satırı = boşlukla ayrılmış tarihler.
on:
  workflow_dispatch:
    inputs:
      tarihler:
        description: "havuz tarihleri (YYYY-MM-DD, boşlukla)"
        default: ""
  push:
    paths:
      - copytrade/v11_sinama/CALISTIR

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  sinama:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sınama
        env:
          GIRDI_TARIHLER: ${{ inputs.tarihler }}
        run: |
          tarihler="${GIRDI_TARIHLER:-$(tail -n 1 copytrade/v11_sinama/CALISTIR)}"
          for t in $tarihler; do [[ "$t" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "geçersiz tarih: $t"; exit 1; }; done
          git fetch --no-tags origin radar:refs/remotes/origin/radar
          mkdir -p cikti
          # shellcheck disable=SC2086
          python -u -m copytrade.v11_sinama --veri-dali radar --tarih $tarihler --json cikti/v11.json --ozet-md cikti/v11.md
      - name: Özet
        if: ${{ always() && hashFiles('cikti/v11.md') != '' }}
        run: cat cikti/v11.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: v11-sinama
          path: cikti
          if-no-files-found: ignore
