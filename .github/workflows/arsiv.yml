name: Hyperliquid arşivi
# Zamanlama durduruldu (kullanıcı kararı 2026-11-01: "projenin tüm run'larını, rutinleri durdur" — izleme.yml'in
# sürekli 150 dk zaman aşımına uğraması nedeniyle). Yeniden açmak için cron satırlarını geri ekleyin.
on:
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: arsiv
  cancel-in-progress: false
jobs:
  arsiv:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Güncel kapı havuzunu al
        run: |
          git fetch --depth=1 origin copytrade-kapi
          mkdir -p guncel-kapi
          git archive FETCH_HEAD copytrade/kapi secim | tar -x -C guncel-kapi
          name=$(ls guncel-kapi/secim | sort | tail -1)
          test -n "$name"
          echo "SECIM=guncel-kapi/secim/$name/secim.json" >> "$GITHUB_ENV"
      - name: R2 imleç ve bugünün kapsamını indir
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: aws s3 sync "s3://${R2_BUCKET}/" arsiv --exclude "*" --include "tur=*/son.json" --include "tur=kapsam/gun=$(date -u +%F)/*" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --no-progress
      - name: 15 dk pozisyon ve mum
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
        run: python -m copytrade.arsiv --root . --output arsiv --kapi-root guncel-kapi/copytrade/kapi --secim "$SECIM" --tur pozisyon,mum_1dk,olay
      - name: Saatlik dolum ve funding
        # Elle tetiklemede de çalışır: GitHub zamanlayıcısı bu repoda saatlik koşuları sık atlıyor (2026-10-29: 12:24'ten sonra tek zamanlı koşu).
        # always(): 15 dk adımı boşluk eşiğiyle kırmızı olsa bile dolum toplanır (2026-10-29: atlanan cron'lar yüzünden hep atlanıyordu).
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *')
        run: python -m copytrade.arsiv --root . --output arsiv --kapi-root guncel-kapi/copytrade/kapi --secim "$SECIM" --tur dolum,funding
      - name: Haftalık leaderboard
        if: always() && github.event.schedule == '13 2 * * 0'
        run: python -m copytrade.arsiv --root . --output arsiv --kapi-root guncel-kapi/copytrade/kapi --secim "$SECIM" --tur leaderboard
      - name: R2'ye ekle
        # Toplanan veri, boşluk eşiği aşılsa da (iş yine kırmızı biter) R2'ye yazılır; yoksa o günün verisi kaybolur.
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: aws s3 sync arsiv "s3://${R2_BUCKET}/" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --no-progress
