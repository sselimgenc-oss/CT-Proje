name: Radar (günlük tarama + kadro)

# T3 (docs/RADAR_V1.md §2, §4, §5): her gün 00:37 UTC (03:37 TSİ) T2 taraması (aday = radar_aday_tavan = 300, 7 gün getiriye göre; K-31) → R2 form puanı → kadro.
# Salt okunur halka açık Hyperliquid verisi; secret YOK. Çıktı veri dalı `radar` (kök commit yalnız ilk koşuda; sonra tarihli klasör eklenir, 90 gün tutulur):
#   radar/<tarih>/{havuz,kadro}.json  +  radar/son/kadro.json  (T4 motoru `son/kadro.json`'u okur).
# Eksik koşuda (zaman bütçesi aşıldı / satır eksik / `veri_hatasi` payı > `radar_veri_hatasi_pay_max`, R-2) `radar_kadro` çıkış kodu 2 verir → iş kırmızı biter ve `son/` GÜNCELLENMEZ. Hata örtülmez (başarısızlık gizlenmez).
# `kural_ust` / `aday_sayisi` girdisi YOK (donmuş kurallar; deneme `radar_deneme.yml`'de).
# Dal doğrulaması: `copytrade/radar/CALISTIR` dosyasına satır eklenen push (main dışı dal) AYNI iş akışını koşturur ama veri dalı `radar-deneme`'ye yazar (gerçek `radar` dalı yalnız main'den dokunulur).
# G-23 (canli_vardiya.yml ile aynı desen): checkout'lar `persist-credentials: false` (token diske yazılmaz); yazma izni yalnız `radar` işinde; push kimliği yalnız
# yayım adımına `YAYIM_TOKEN` ile (radar_yayimla.sh, GIT_CONFIG_* extraheader). Tarama/kadro/isabet (python) adımları token görmez.
on:
  schedule:
    - cron: "37 0 * * *"
    - cron: "17 2 * * *"            # YEDEK (T6 §4): 2026-11-05'te birincil cron hiç tetiklenmedi; o günün radar/<tarih>/ klasörü varsa iş hiçbir şey yapmadan biter
  workflow_dispatch:
  push:
    paths:
      - copytrade/radar/CALISTIR

permissions:
  contents: read                    # G-23: yazma yalnız `radar` işinde (iş düzeyinde)

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  # S-19 (denetim 08.11): grup ref'e bağlı; dal deneme push'u main koşusunu (bekleyen) yerinden edip iptal ettiremez (11-04 olayı). Üretim (main) grubu adı değişmedi.
  group: ${{ github.ref == 'refs/heads/main' && 'radar' || format('radar-deneme-{0}', github.ref_name) }}
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read                # kontrol işi yazmaz (veri dalını yalnız okur)
    outputs:
      atla: ${{ steps.k.outputs.atla }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: k
        name: Zamanlama kontrolü (yedek cron)
        env:
          VERI_DALI: ${{ github.ref == 'refs/heads/main' && 'radar' || 'radar-deneme' }}
          ZAMANLAMA: ${{ github.event.schedule }}
          YEDEK_CRON: "17 2 * * *"
        run: bash .github/scripts/zamanlama_kontrol.sh radar
  radar:
    needs: kontrol
    if: ${{ needs.kontrol.outputs.atla != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write               # veri dalı yayımı (yalnız radar_yayimla.sh, YAYIM_TOKEN ile)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false  # G-23: yazma token'ı .git/config'e yazılmaz (kurulum/tarama/kadro/isabet adımları görmez)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Seçim yapısı D+ (K-55/K-56; üye denetimi her gün, doldurma ilk koşu + ayın ilk koşusu)
        env:
          VERI_DALI: ${{ github.ref == 'refs/heads/main' && 'radar' || 'radar-deneme' }}
        run: |
          mkdir -p radar
          # Önceki kadro = veri dalındaki son/kadro.json (bugünkü yayından önce). v2 değilse (v1/v1.1) ya da yoksa: ilk doldurma.
          onceki=()
          if git cat-file -e "origin/$VERI_DALI:radar/son/kadro.json" 2>/dev/null; then
            git show "origin/$VERI_DALI:radar/son/kadro.json" > "$RUNNER_TEMP/onceki_kadro.json"
            onceki=(--onceki-kadro "$RUNNER_TEMP/onceki_kadro.json")
          fi
          # D+ (K-56): motor durumu (slot sicili, cezayla düşenler) canli-durum dalından; yoksa yedek kurallar
          canli=()
          if git cat-file -e "origin/canli-durum:durum/hesap.json" 2>/dev/null; then
            git show "origin/canli-durum:durum/hesap.json" > "$RUNNER_TEMP/canli_hesap.json"; canli+=(--canli-hesap "$RUNNER_TEMP/canli_hesap.json")
          fi
          if git cat-file -e "origin/canli-durum:durum/saha.json" 2>/dev/null; then
            git show "origin/canli-durum:durum/saha.json" > "$RUNNER_TEMP/canli_saha.json"; canli+=(--canli-saha "$RUNNER_TEMP/canli_saha.json")
          fi
          python -u -m copytrade.secim_d --cikti radar "${onceki[@]}" "${canli[@]}"
      - name: Özet
        if: ${{ always() && hashFiles('radar/OZET.md') != '' }}
        run: |
          cat radar/OZET.md >> "$GITHUB_STEP_SUMMARY"
          if [ -s radar/ISABET_OZET.md ]; then cat radar/ISABET_OZET.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: radar-havuz-kadro
          path: radar
          if-no-files-found: ignore
      - name: Veri dalına yaz (radar)
        env:
          VERI_DALI: ${{ github.ref == 'refs/heads/main' && 'radar' || 'radar-deneme' }}
          YAYIM_TOKEN: ${{ github.token }}  # G-23: push kimliği yalnız yayım betiğine
        run: bash .github/scripts/radar_yayimla.sh
