name: İzleme deneme (küçük gerçek veri)

# Kalite kuralı 1: izleme değişiklikleri tam koşudan önce küçük gerçek veriyle denenir. Ana izleme listesinden seçilen trader'larla ilk okuma + aynı durumla artımlı koşu;
# üretim R2'sine ve veri dallarına YAZMAZ, çıktı yalnız iş günlüğü / özeti ve artifact'tır.
# Tetik: elle ya da `copytrade/izleme_deneme/CALISTIR` dosyasına push (kendi dalından deneme).
on:
  workflow_dispatch:
    inputs:
      idler:
        description: "izleme listesinden virgülle ayrılmış trader kimlikleri"
        default: "K08,O17,B02,H001,B17"
  push:
    paths:
      - copytrade/izleme_deneme/CALISTIR

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  deneme:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Deneme listesini seç
        env:
          IDLER: ${{ inputs.idler || 'K08,O17,B02,H001,B17' }}
        run: |
          mkdir -p deneme deneme_kok/copytrade deneme_izleme
          python -m copytrade.ilk11_deneme liste --kaynak copytrade/izleme_listesi.yaml --idler "$IDLER" --cikti deneme
      - name: İzleme - ilk okuma, sonra aynı durumla artımlı koşu
        run: |
          basla=$(date +%s)
          python -m copytrade.izleme_motoru --root deneme_kok --output deneme_izleme --liste deneme/izleme_listesi.yaml
          echo "$(( $(date +%s) - basla ))" > deneme/izleme_sure_sn.txt
          basla=$(date +%s)
          python -m copytrade.izleme_motoru --root deneme_kok --output deneme_izleme --liste deneme/izleme_listesi.yaml
          echo "$(( $(date +%s) - basla ))" > deneme/izleme_artimli_sn.txt
      - name: Özet
        if: ${{ always() && hashFiles('deneme_izleme/durum.json') != '' }}
        run: |
          python -m copytrade.ilk11_deneme durum-ozeti --durum deneme_izleme/durum.json --sure-sn "$(cat deneme/izleme_sure_sn.txt)" --artimli-sn "$(cat deneme/izleme_artimli_sn.txt)" > deneme/OZET.md
          cat deneme/OZET.md
          cat deneme/OZET.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: izleme-deneme
          path: |
            deneme
            deneme_izleme/durum.json
          if-no-files-found: ignore
