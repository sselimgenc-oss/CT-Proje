name: Sonnet işçi (@sonnet tetikler)

# Lider (Claude) bir görev PR'ına "@sonnet ..." yazınca Sonnet çalışır, aynı PR dalına commit atar.
# Commit'ler CI'ı tetikler; CI sonucu ve PR yorumları lider oturumunu uyandırır (K-19).
# Güvenlik: yalnız repoya yazma yetkisi olanların yorumu tetikler (eylemin varsayılanı); bot yorumu tetiklemez.
# Gerekli gizli anahtar: CLAUDE_CODE_OAUTH_TOKEN (kullanıcının Sonnet hesabından `claude setup-token`).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: sonnet-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sonnet:
    if: contains(github.event.comment.body, '@sonnet')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --prefix worker || npm install --prefix worker
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@sonnet"
          additional_permissions: |
            actions: read
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 400
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,TodoWrite"
            --append-system-prompt "Sen bu reponun yazıcısısın (Sonnet). AGENTS.md, DURUM.md ve görevde adı geçen docs/GOREV_*.md belgesine harfiyen uy. Bu PR'ın dalında çalış, commit at ve push et; yeni dal/PR açma, main'e dokunma. Belgede olmayan karar gerekiyorsa dur ve docs/sonnet_durum_<iş>.md'ye yaz, commit et. Bitirince python -m pytest -q ve npm test --prefix worker sonuçlarını, silinen/eklenen dosya listesini ve kabul maddelerinin her birinin durumunu ilerleme yorumuna Türkçe yaz; son satıra 'LIDER: hazir' ya da 'LIDER: soru var' yaz."
