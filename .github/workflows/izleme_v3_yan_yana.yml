name: İzleme v3 eski ↔ yeni (yan yana deneme)

# Kural 6 (hesap değişikliği yan yana): aynı traderlar, aynı dakikalarda, ESKİ kod (main) ve YENİ kod (bu dal) ile ilk okuma; v3 sayıları yan yana basılır.
# Üretim R2'sine ve veri dallarına YAZMAZ. Tetik: elle ya da `copytrade/izleme_deneme/YAN_YANA` dosyasına push.
on:
  workflow_dispatch:
    inputs:
      idler:
        description: "izleme listesinden virgülle ayrılmış trader kimlikleri"
        default: "K08,O17,B02,H001,B17"
      eski_ref:
        description: "ESKİ kod referansı (dal / etiket / sha)"
        default: "main"
  push:
    paths:
      - copytrade/izleme_deneme/YAN_YANA

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  yan_yana:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.eski_ref || 'main' }}
          path: eski
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Deneme listesini seç
        env:
          IDLER: ${{ inputs.idler || 'K08,O17,B02,H001,B17' }}
        run: |
          mkdir -p deneme deneme_kok/copytrade deneme_izleme deneme_kok_eski/copytrade deneme_izleme_eski
          python -m copytrade.ilk11_deneme liste --kaynak copytrade/izleme_listesi.yaml --idler "$IDLER" --cikti deneme
      - name: ESKİ kod ilk okuma
        working-directory: eski
        run: python -m copytrade.izleme_motoru --root ../deneme_kok_eski --output ../deneme_izleme_eski --liste ../deneme/izleme_listesi.yaml
      - name: YENİ kod ilk okuma
        run: python -m copytrade.izleme_motoru --root deneme_kok --output deneme_izleme --liste deneme/izleme_listesi.yaml
      - name: ESKİ kod tekrar (sapma ölçümü: aynı kod, ~20 dk sonra)
        working-directory: eski
        run: |
          mkdir -p ../deneme_kok_eski2/copytrade ../deneme_izleme_eski2
          python -m copytrade.izleme_motoru --root ../deneme_kok_eski2 --output ../deneme_izleme_eski2 --liste ../deneme/izleme_listesi.yaml
      - name: Yan yana özet
        run: |
          python -m copytrade.ilk11_deneme v3-yan-yana --eski deneme_izleme_eski/durum.json --yeni deneme_izleme/durum.json > deneme/YAN_YANA.md
          cat deneme/YAN_YANA.md
          cat deneme/YAN_YANA.md >> "$GITHUB_STEP_SUMMARY"
          python - <<'EOF'
          import json
          oku = lambda p: {t["id"]: t for t in json.load(open(p))["traderlar"]}
          e1, y, e2 = oku("deneme_izleme_eski/durum.json"), oku("deneme_izleme/durum.json"), oku("deneme_izleme_eski2/durum.json")
          print("\n### sapma ölçümü: v3 bakiye $ (ESKİ -> YENİ -> ESKİ tekrar; aynı kod ESKİ'ler arası fark = piyasa sapması)")
          for k in sorted(e1):
              b = lambda t: (t[k].get("sanal_kopya_v3") or {}).get("bakiye_usd")
              print(f"{k}: {b(e1)} -> {b(y)} -> {b(e2)}")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: izleme-v3-yan-yana
          path: |
            deneme
            deneme_izleme/durum.json
            deneme_izleme_eski/durum.json
          if-no-files-found: ignore
