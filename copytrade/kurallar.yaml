fiyat_farki_gec_ortalama_bp: 1.5
fiyat_farki_dur_medyan_bp: 2.0
fiyat_farki_dur_p90_bp: 15.0
fiyat_farki_dur_ortalama_bp: 3.0
fiyat_farki_min_dolum: 300
fiyat_farki_min_gun: 3
fiyat_farki_min_coin: 15
fiyat_farki_grup_min_dolum: 30


