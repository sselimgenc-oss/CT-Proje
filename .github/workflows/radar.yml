name: Radar (günlük tarama + kadro)

# K-78 (20.11, kullanıcı kararı): günlük radar artık SUNUCUDA koşar (deploy/sanal_radar.sh + sg-sanal-radar.timer, 00:37 UTC = 03:37 TSİ). Actions cron'u ~7 sa geç tetikleniyordu (kadro 03:37 yerine ~10:42'de çıkıyordu).
# Bu iş akışında zamanlama (cron) YOK: yalnız ELLE YEDEK (workflow_dispatch; sunucu radarı çalışmazsa). Adımlar sunucu betiğiyle AYNIDIR (formül değişmedi).

# K-85 (21.11, kullanıcı kararı): yeni sade seçim. 30 günlük veri, TÜM radar evreni (7 günlük sıralama / 900 aday ön kesmesi yok); 5 trader, yedek yok; kadro yalnız Pazartesi/Perşembe değişir
# (ilk kurulum / yeni dönemde hemen kurulur). Form puanı, bootstrap, isabet / PBO / rastgele / holdout adımları KALDIRILDI. Kontrol günü değilse tarama yapılmaz, kadro aynen sürer.
# Salt okunur halka açık Hyperliquid verisi; secret YOK. Çıktı veri dalı `radar` (kök commit yalnız ilk koşuda; sonra tarihli klasör eklenir, 90 gün tutulur):
#   radar/<tarih>/{havuz,kadro}.json  +  radar/son/kadro.json  (motor `son/kadro.json`'u okur; `radar_surum` v5).
# Eksik koşuda (zaman bütçesi aşıldı / `veri_hatasi` payı > `radar_veri_hatasi_pay_max`) `radar_kadro` çıkış kodu 2 verir → iş kırmızı biter ve `son/` GÜNCELLENMEZ.
# `kural_ust` / `aday_sayisi` girdisi YOK (kurallar kurallar.yaml'da).
# Dal doğrulaması: main dışı dalda `workflow_dispatch` AYNI iş akışını koşturur ama veri dalı `radar-deneme`'ye yazar (gerçek `radar` dalı yalnız main'den dokunulur).
# 14.11 denetim: `push` tetiği yalnız main (`branches: [main]`); dalda `copytrade/radar/CALISTIR` push'u artık koşu BAŞLATMAZ.
# G-23 (canli_vardiya.yml ile aynı desen): checkout'lar `persist-credentials: false` (token diske yazılmaz); yazma izni yalnız `radar` işinde; push kimliği yalnız
# yayım adımına `YAYIM_TOKEN` ile (radar_yayimla.sh, GIT_CONFIG_* extraheader). Tarama/kadro/isabet (python) adımları token görmez.
on:
  workflow_dispatch:                # elle yedek (K-78: cron kaldırıldı, günlük koşu sunucuda)
  push:
    branches: [main]              # 14.11 denetim: dal push'u CALISTIR ile deneme koşusu BAŞLATMAZ (istenmeyen koşular oldu); deneme = workflow_dispatch
    paths:
      - copytrade/radar/CALISTIR

permissions:
  contents: read                    # G-23: yazma yalnız `radar` işinde (iş düzeyinde)

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  # S-19 (denetim 08.11): grup ref'e bağlı; dal deneme push'u main koşusunu (bekleyen) yerinden edip iptal ettiremez (11-04 olayı). Üretim (main) grubu adı değişmedi.
  group: ${{ github.ref == 'refs/heads/main' && 'radar' || format('radar-deneme-{0}', github.ref_name) }}
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read                # kontrol işi yazmaz (veri dalını yalnız okur)
    outputs:
      atla: ${{ steps.k.outputs.atla }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: k
        name: Zamanlama kontrolü (yedek cron)
        env:
          VERI_DALI: ${{ github.ref == 'refs/heads/main' && 'radar' || 'radar-deneme' }}
        run: bash .github/scripts/zamanlama_kontrol.sh radar
  radar:
    needs: kontrol
    if: ${{ needs.kontrol.outputs.atla != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300             # K-85: tarama bütçesi radar_zaman_butcesi_dk 240 + kurulum/yayım payı (tüm evren)
    permissions:
      contents: write               # veri dalı yayımı (yalnız radar_yayimla.sh, YAYIM_TOKEN ile)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false  # G-23: yazma token'ı .git/config'e yazılmaz (kurulum/tarama/kadro/isabet adımları görmez)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Radar taraması (K-85 30 günlük sade seçim)
        env:
          VERI_DALI: ${{ github.ref == 'refs/heads/main' && 'radar' || 'radar-deneme' }}
        run: |
          mkdir -p radar
          # K-85: önceki kadro (veri dalı son/kadro.json: üyeler, yasak listesi, dönem) kontrol günü / ilk kurulum kararı için okunur. Yoksa (ilk koşu) argümansız = ilk kurulum.
          onceki=()
          if git cat-file -e "origin/$VERI_DALI:radar/son/kadro.json" 2>/dev/null; then
            git show "origin/$VERI_DALI:radar/son/kadro.json" > "$RUNNER_TEMP/onceki_kadro.json"
            onceki=(--onceki-kadro "$RUNNER_TEMP/onceki_kadro.json")
          fi
          python -u -m copytrade.radar_tarama --cikti radar "${onceki[@]}" --ozet-md radar/OZET.md
      - name: Kadro (5 trader, Pazartesi/Perşembe değişimi)
        env:
          VERI_DALI: ${{ github.ref == 'refs/heads/main' && 'radar' || 'radar-deneme' }}
        run: |
          havuz="$(ls radar/*/havuz.json | tail -n 1)"
          onceki=()
          if [ -f "$RUNNER_TEMP/onceki_kadro.json" ]; then onceki=(--onceki-kadro "$RUNNER_TEMP/onceki_kadro.json"); fi
          python -u -m copytrade.radar_kadro --havuz "$havuz" "${onceki[@]}"
      - name: Özet
        if: ${{ always() && hashFiles('radar/OZET.md') != '' }}
        run: |
          cat radar/OZET.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: radar-havuz-kadro
          path: radar
          if-no-files-found: ignore
      - name: Veri dalına yaz (radar)
        env:
          VERI_DALI: ${{ github.ref == 'refs/heads/main' && 'radar' || 'radar-deneme' }}
          YAYIM_TOKEN: ${{ github.token }}  # G-23: push kimliği yalnız yayım betiğine
        run: bash .github/scripts/radar_yayimla.sh
