name: Kalıcılık testi (8 hafta, yalnız bilgi)

# K-53 doğrulaması (`copytrade/kalicilik_testi.py`): "bir haftanın R1'i geçenleri sonraki hafta kopyada kazandırdı mı?" Salt okunur, secret YOK, veri dallarına YAZMAZ;
# kurallar ve motor değişmez. 6 parça paralel ölçer (her parça ~110 adres), son iş birleştirip özet yazar (iş özeti + günlükte KALICILIK_JSON). Elle ya da push: `copytrade/kalicilik/CALISTIR`.
on:
  workflow_dispatch:
  push:
    paths:
      - copytrade/kalicilik/CALISTIR

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  olc:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        parca: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ölçüm (parça)
        env:
          PARCA: ${{ matrix.parca }}
        run: |
          git fetch --no-tags origin radar:refs/remotes/origin/radar
          mkdir -p cikti
          python -u -m copytrade.kalicilik_testi olc --parca "${PARCA}/6" --butce-dk 320 --cikti "cikti/k${PARCA}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: kalicilik-${{ matrix.parca }}
          path: cikti
          if-no-files-found: ignore

  analiz:
    needs: olc
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: kalicilik-*
          path: cikti
          merge-multiple: true
      - name: Analiz
        run: |
          ls -la cikti
          python -u -m copytrade.kalicilik_testi analiz cikti/k*.json --ozet-md ozet.md
          cat ozet.md >> "$GITHUB_STEP_SUMMARY"
