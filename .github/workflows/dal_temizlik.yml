# Tek seferlik: eski sisteme ait uzak dalları siler (kullanıcı onayı 2026-11-04, K-19). Liste açık yazılıdır; liste dışında hiçbir dala dokunmaz.
# Elle ya da bu dosya main'e girince bir kez çalışır (oturumun elle tetikleme yetkisi yok). İş bitince bu dosya bir sonraki PR'da kaldırılır.
name: Dal temizliği (tek seferlik)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/dal_temizlik.yml']
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  temizle:
    runs-on: ubuntu-latest
    steps:
      - name: Listedeki dalları sil
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          KORUNAN="main claude/stoic-carson-w3xagz copytrade-izleme radar radar-deneme"
          DALLAR="claude/a0-test-yesil claude/a0-worker-export claude/a1-ilk11-sartname claude/a2-1-alanlar claude/a2-2-pazar claude/a2-3-is-akislari
          claude/a2-3b-olcum claude/a2-3b-plan-zaman claude/a2-4-hesap-spot claude/a4-1-trader-dusmesin claude/a4-2-olay-arsiv claude/a4-3a-tani
          claude/a4-3a-v3-fiyat claude/a4-3b-bekleyen claude/a4-4-tani claude/ayar-add-repo claude/brave-bardeen-dmrvun claude/confident-babbage-och5vs
          claude/degisim-rapor-v3 claude/denetim-manuel-karar claude/dolgu-429 claude/durdur-run-rutinleri claude/e1-gecikme-pencere claude/e1-gercek-gecikme
          claude/e1-veri-hatti-sagligi claude/e2-kopya-v2 claude/e2-sabit-tutar claude/e2-tasfiye-birlesim claude/e3-cikis-kurallari claude/faz2-cay-ocagi-kaldir
          claude/faz2-pano-istegi claude/gorev-h5 claude/h1-gecikme-kar claude/h2-dinleyici claude/h2b-dolgu claude/h5-risk claude/h5b-baslangic-poz
          claude/hf-dogrulama claude/hk-kapi-gorev claude/izleme-2-saat claude/izleme-mum-paylasim claude/k17-anlik-kopya claude/k19-argon claude/kapi-48-parca
          claude/kapi-5xx claude/kopya-v4 claude/kopya-v5 claude/pano-arayuz claude/pano-canli claude/pano-iyilestirme claude/pano-v3-baglanti claude/r2-tani
          claude/t1-eski-sistem-sil claude/t1b-sunucusuz claude/t2-radar-tarama claude/t3-form-kadro claude/tender-thompson-0m5jb1 claude/teshis-b17
          claude/v2-tarama-perf claude/workflow-arsiv claude/zen-heisenberg-lx1ond codex/denetim-etre-gecis-2026-10-30 codex/denetim-etre-gecis-tekrar-2026-10-30
          codex/denetim-genel-20261029 copytrade-kapi faz1-son"
          silinen=0; yok=0
          for d in $DALLAR; do
            for k in $KORUNAN; do [ "$d" != "$k" ] || { echo "korunan dal listede: $d"; exit 1; }; done
            if gh api -X DELETE "repos/$REPO/git/refs/heads/$d" >/dev/null 2>&1; then echo "silindi: $d"; silinen=$((silinen+1))
            else echo "yok/silinemedi: $d"; yok=$((yok+1)); fi
          done
          echo "silinen $silinen, yok/silinemedi $yok" | tee -a "$GITHUB_STEP_SUMMARY"
