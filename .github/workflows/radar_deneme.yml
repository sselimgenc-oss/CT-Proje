name: Radar deneme (R0 + R1 taraması)

# T2/T3 (docs/RADAR_V1.md §2–4): lider tablosundan aday + R1 kopyalanabilirlik + R2 ham girdileri. Salt okunur, secret YOK, veri dallarına YAZMAZ; çıktı `havuz.json` (+ `kadro.json`) artifact'ı + iş özeti.
# Günlük zamanlı koşu `radar.yml`'dir; bu iş akışı YALNIZ deneme içindir. `aday_sayisi`: 7 gün getiriye göre ilk N aday (K-31; varsayılan 20; tam tarama 300 = kurallar.yaml radar_aday_tavan).
# `kural_ust` (YALNIZ deneme; `radar.yml`'de YOK): boşlukla ayrılmış `radar_<anahtar>=<değer>` (ör. `radar_min_islem=5`, T3 §1b bilgi koşusu); `havuz.json` `kural_ust` alanında görünür. Karar değildir.
# Deneme koşuları v4 ↔ v5 yan yana bilgi alanını (`v4_kopya_getiri_7g`) da yazar.
on:
  workflow_dispatch:
    inputs:
      aday_sayisi:
        description: "ilk N aday (7 gün getiriye göre, K-31); tam tarama için 300"
        default: "20"
      kural_ust:
        description: "YALNIZ deneme: boşlukla ayrılmış radar_<anahtar>=<değer> (ör. radar_min_islem=5); boş = kurallar.yaml aynen"
        default: ""
  push:
    paths:
      - copytrade/radar_deneme/CALISTIR

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Radar taraması (R0 + R1)
        env:
          GIRDI_ADAY_SAYISI: ${{ inputs.aday_sayisi }}
          GIRDI_KURAL_UST: ${{ inputs.kural_ust }}
        run: |
          # elle koşuda girdiler; push ile tetiklenen koşuda `copytrade/radar_deneme/CALISTIR` son satırı: ilk sözcük = aday sayısı (sayı değilse 20), kalan `radar_x=deger` sözcükleri = kural_ust
          satir="$(tail -n 1 copytrade/radar_deneme/CALISTIR)"
          aday="${GIRDI_ADAY_SAYISI:-${satir%% *}}"
          case "$aday" in ''|*[!0-9]*) aday=20 ;; esac
          if [ -n "${GIRDI_ADAY_SAYISI:-}" ]; then ust="${GIRDI_KURAL_UST:-}"; else ust="${satir#* }"; fi
          kural=()
          for sozcuk in $ust; do
            case "$sozcuk" in radar_*=*) kural+=(--kural-ust "$sozcuk") ;; esac
          done
          mkdir -p radar
          python -u -m copytrade.radar_tarama --cikti radar --aday-sayisi "$aday" --v4-yan-yana --payda-yan-yana "${kural[@]}" --ozet-md radar/OZET.md
      - name: Özet
        if: ${{ always() && hashFiles('radar/OZET.md') != '' }}
        run: cat radar/OZET.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: radar-havuz
          path: radar
          if-no-files-found: ignore
