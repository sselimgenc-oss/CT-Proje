name: İsabet deneme (§7b küçük gerçek veri denemesi)

# T6 §1 (AGENTS kalite 1): tam koşudan önce `radar-deneme` (ya da `radar`) geçmişiyle isabet ölçümünü gerçek veride dener. Salt okunur, secret YOK, veri dallarına YAZMAZ; çıktı `isabet.json` artifact'ı + iş özeti.
# `--kismi`: 7 gün dolmamış pencereyi de ölçer (`pencere_tam: false` yazar); gerçek ölçüm `radar.yml`'dedir (yalnız tam pencere). Elle: tarih ve veri dalı girdileri; push: `copytrade/isabet_deneme/CALISTIR` son satırı "<tarih> <veri_dali>".
on:
  workflow_dispatch:
    inputs:
      tarih:
        description: "ölçülecek havuz tarihi (YYYY-MM-DD)"
        default: "2026-11-04"
      veri_dali:
        description: "havuz/kadro okunan veri dalı (radar | radar-deneme)"
        default: "radar-deneme"
  push:
    paths:
      - copytrade/isabet_deneme/CALISTIR

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  isabet:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Seçim isabeti (kısmi pencere denemesi)
        env:
          GIRDI_TARIH: ${{ inputs.tarih }}
          GIRDI_VERI_DALI: ${{ inputs.veri_dali }}
        run: |
          satir="$(tail -n 1 copytrade/isabet_deneme/CALISTIR)"
          tarih="${GIRDI_TARIH:-${satir%% *}}"
          dal="${GIRDI_VERI_DALI:-${satir##* }}"
          case "$dal" in radar|radar-deneme) ;; *) dal=radar-deneme ;; esac
          mkdir -p radar
          python -u -m copytrade.radar_isabet --cikti radar --veri-dali "$dal" --tarih "$tarih" --kismi --ozet-md radar/ISABET_OZET.md
      - name: Özet
        if: ${{ always() && hashFiles('radar/ISABET_OZET.md') != '' }}
        run: cat radar/ISABET_OZET.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isabet
          path: radar
          if-no-files-found: ignore
