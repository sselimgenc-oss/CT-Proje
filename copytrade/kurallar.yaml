karsi_olgu_sik_nedenler: [slot_tavani]  # neden listesi (yalnız kayıt, işlem etkisi yok): bu nedenler (adres, coin) başına her dilimde bir kez kaydedilir; diğer nedenler (adres, coin) başına tek kayıt kalır
karsi_olgu_sik_aralik_dk: 60            # dakika (yalnız kayıt, işlem etkisi yok): sık nedenlerde örnekleme dilimi; saat başına bir kayıt
karsi_olgu_sik_azami: 300               # adet (yalnız kayıt, işlem etkisi yok): sık nedenlerin aynı anda açık karşı-olgu üst sınırı; genel 500 sınırı ayrıca geçerli
kopya_drift_esik: 0.25                  # oran (|biz − ideal| / ideal nosyonel bundan BÜYÜKSE drift; yalnız kayıt/uyarı, işlem etkisi yok)
kopya_drift_sure_dk: 30                 # dakika (drift bu kadar sürerse `kopya_drift` kaydı; yalnız kayıt/bilgi, işlem etkisi yok)
kopya_drift_min_usd: 50                 # $ (ideal nosyonel bundan küçük coinler izlenmez; yalnız kayıt/uyarı, işlem etkisi yok)
kopya_drift_tg_saat: 6                  # saat (aynı coin saatlik özetteki "Kopya sapması" satırında en çok bu aralıkta bir; AYRI Telegram mesajı yok, önem INFO)
kopya_drift_telegram: false             # ayrı (tek coin) Telegram uyarısı KAPALI; sapma yalnız saatlik özet satırında (kod yolu kaldırıldı, bayrak main ile uyumlu)

# Fiyat farkı ölçümü kabul ölçütü (copytrade/olcum/fiyat_farki.py; Binance hazırlığı 5a). KULLANICI ONAYI BEKLENİYOR: eşikler koordinatör önerisidir, onaylanana dek değiştirilebilir. Birim bp, yön düzeltilmiş (aleyhimize +).
# GEÇ = medyan ≤ gec_medyan_bp VE p90 ≤ gec_p90_bp VE ortalama ≤ gec_ortalama_bp; DUR = medyan > dur_medyan_bp VEYA p90 > dur_p90_bp VEYA ortalama > dur_ortalama_bp; arası GRİ.
# Yeterlilik: toplam eşleşmiş dolum, gün ve coin asgarisi altında "örnek yetersiz"; grup başına asgari dolumun altında "karar yok".
