# Aşırı uydurma koruması (Faz 2; docs/HOLDOUT_PBO.md): yalnız RAPOR/mühür, karar koduna ve radar_* eşiklerine dokunmaz
holdout_bas: "2026-11-20"               # YYYY-MM-DD (bu tarihten itibaren radar günlük çıktıları mühürlenir; holdout yalnız bir kez değerlendirilir; metin olarak yazılır)
pbo_s: 8                                # blok (PBO/CSCV: dönemler bu kadar eşit bloğa bölünür, çift olmalı; T < 2×S ise "yetersiz veri")
para_hareketi_isaret_payi: 0.2          # oran (T6 §2, bilgi: net yatırma / hafta başı sermaye bunun üstündeyse raporda işaretlenir; kapıyı DEĞİŞTİRMEZ)
# Gölge kurallar (Fable 18.11): motor `golge_kural` olayı yazar (kural başlayınca/bitince). K-73: SANAL kipte `sanal_golge_kurallar_etkin` ile açılış/artırmayı etkiler (A, B20: atla; B5: boyut x0,5); gerçek kipte yalnız kayıt
golge_hesap_alt_usd: 5000               # $ (trader hesap değeri bundan KÜÇÜKSE A_hesap_5k; sanalda yeni açılış atlanır: hesap_kucuk)
golge_kaldirac_uyari: 5                 # x (anlık kaldıraç bundan BÜYÜKSE B_kaldirac_5x; sanalda yeni açılış/artırma boyutu x0,5)
golge_kaldirac_cikar: 20                # x (anlık kaldıraç bundan BÜYÜKSE B_kaldirac_20x; sanalda yeni açılış atlanır: kaldirac_cok_yuksek)
sanal_golge_kurallar_etkin: true        # bool, K-73: yalnız sanal kip; false = gölge kurallar yalnız kayıt
# ML Otonom rejim etiketi (kayıt; K-73: sanalda sanal_rejim_filtre ile açılış filtresi): motor `rejim_degisti` olayı ve emir olaylarındaki `rejim` alanını yazar.
rejim_kaynak_url: "https://trader-pano-acik.sselimgenc-c18.workers.dev/rejim.json"                    # URL (boşsa kapalı; ağ çağrısı yapılmaz). Yayın: ML Otonom rejim.json (belirtim: rejim-yayini-spec)
rejim_okuma_dk: 30                      # dakika
sanal_rejim_filtre: true                # bool, K-73: SANAL kipte 1d ve 4h rejimi ikisi de giriş yönüne TERS (long/trend_down, short/trend_up) ise yeni açılış/artırma atlanır (rejim_ters); bilinmeyen etiket = atlama yok; gerçek kip etkilenmez
# Haber / duygu etiketi (kayıt; K-73: sanalda sanal_haber_filtre ve sanal_duygu_filtre ile açılış filtresi): `emir` olaylarına `duygu` + `haber` (o coin), `duygu_degisti` olayı; ton etiketi KABA anahtar kelime sayımıdır
haber_aktif: true                       # false ise ağ çağrısı yapılmaz (haber filtresi de bilgisiz kalır)
sanal_haber_filtre: true                # bool, K-73: SANAL kipte coin haber tonu giriş yönüne ters (long/negatif, short/pozitif) ve 24 sa başlık sayısı >= sanal_haber_min_baslik ise yeni açılış/artırma atlanır (haber_ters); gerçek kip etkilenmez
sanal_haber_min_baslik: 2               # adet (haber_ters için asgari 24 sa başlık sayısı)
sanal_duygu_filtre: true                # bool, K-73: SANAL kipte Fear&Greed >= duygu_ust iken yeni long, <= duygu_alt iken yeni short açılış/artırma atlanır (duygu_ters); değer yok/bayat = atlama yok; gerçek kip etkilenmez
duygu_ust: 75                           # endeks (0-100; bu değer ve üstü = aşırı açgözlülük: yeni long yok)
duygu_alt: 25                           # endeks (0-100; bu değer ve altı = aşırı korku: yeni short yok)
haber_okuma_dk: 60                      # dakika
haber_kaynaklar:                        # herkese açık RSS (anahtarsız); 24 sa içinde coin'i anan başlıklar sayılır
  - "https://www.coindesk.com/arc/outboundfeeds/rss/"
  - "https://cointelegraph.com/rss"
duygu_kaynak_url: "https://api.alternative.me/fng/?limit=1"      # Crypto Fear & Greed (0-100); boşsa duygu okunmaz

# Alınmayan sinyal kaydı + kopya drift alarmı (yalnız kayıt/uyarı, işlem etkisi yok)
karsi_olgu_azami_saat: 72               # saat (hayali pozisyon trader kapatmazsa bu sürede kapanır; yalnız kayıt/uyarı, işlem etkisi yok)
karsi_olgu_sik_nedenler: [slot_tavani]  # neden listesi (yalnız kayıt, işlem etkisi yok): bu nedenler (adres, coin) başına her dilimde bir kez kaydedilir; diğer nedenler (adres, coin) başına tek kayıt kalır
karsi_olgu_sik_aralik_dk: 60            # dakika (yalnız kayıt, işlem etkisi yok): sık nedenlerde örnekleme dilimi; saat başına bir kayıt
karsi_olgu_sik_azami: 300               # adet (yalnız kayıt, işlem etkisi yok): sık nedenlerin aynı anda açık karşı-olgu üst sınırı; genel 500 sınırı ayrıca geçerli
kopya_drift_esik: 0.25                  # oran (|biz − ideal| / ideal nosyonel bundan BÜYÜKSE drift; yalnız kayıt/uyarı, işlem etkisi yok)
kopya_drift_sure_dk: 30                 # dakika (drift bu kadar sürerse `kopya_drift` kaydı; yalnız kayıt/bilgi, işlem etkisi yok)
kopya_drift_min_usd: 50                 # $ (ideal nosyonel bundan küçük coinler izlenmez; yalnız kayıt/uyarı, işlem etkisi yok)
kopya_drift_tg_saat: 6                  # saat (aynı coin saatlik özetteki "Kopya sapması" satırında en çok bu aralıkta bir; AYRI Telegram mesajı yok, önem INFO)
kopya_drift_telegram: false             # ayrı (tek coin) Telegram uyarısı KAPALI; sapma yalnız saatlik özet satırında (kod yolu kaldırıldı, bayrak main ile uyumlu)

# Ortak öğrenme (kullanıcı kararı 19.11; docs/ORTAK_OGRENME_CT.md): her kapanan kopya işlemi kaydedilir, dersler YALNIZ riski azaltır (emekli = yeni açılış yok; çarpan 0,5–1,0). Yalnız sanal kip; sert sınırlara dokunmaz
ogrenme_aktif: true                     # açık/kapalı (false: kayıt da, ders de yok). Gerçek kipte zaten çalışmaz
ogrenme_r_birim_oran: 0.02              # oran (1R = pozisyonun en büyük nosyonelinin bu kadarı; R = net K/Z ÷ 1R)
ogrenme_shrink_n: 5                     # adet (ders etkisi n/(n+shrink_n) ile küçültülür: az örnekle uygulama temkinli)
ogrenme_min_n: 2                        # adet (bir ders en az bu kadar işlemle ölçülmüşse uygulanır)
ogrenme_agirlik_etki_r: 1.0             # R (bir trader için canlı derslerin toplam etkisi bundan büyük/eşitse slot çarpanı düşer)
ogrenme_emekli_etki_r: 3.0              # R (toplam etki bundan büyük/eşitse trader "emekli": yeni açılışı haftalık kadro değişimine dek kopyalanmaz; çarpan bu etkide 0,5'e iner)
ogrenme_fren_esik_r: 10.0               # R (uygulanan derslerin uygulamadan sonraki toplamı bunun altına inerse HEPSİ geri alınır; paket fren_durumu)
ogrenme_geri_alma_r: 3.0                # R (tek bir uygulanan dersin etkisi bunun altına inerse o ders geri alınır)
ogrenme_degerlendirme_dk: 60            # dakika (ders değerlendirmesi en çok bu sıklıkta; hata motoru durdurmaz)
# Ortak öğrenme ML filtresi (parça 2; kullanıcı kararı 19.11): trader başına ridge-lojistik; yeni açılış/artırmayı puanlar, puan eşiğin altındaysa ATLAR (`ml_filtre_atla`; alınmayan sinyal kaydına düşer). Asla artırmaz
ogrenme_filtre_aktif: true              # kapatma anahtarı (false: filtre eğitilmez/uygulanmaz). Model yok / süresi (21 gün) dolmuş / numpy yok → her şey geçer + `ml_filtre_yok` kaydı
ogrenme_filtre_min_n: 20                # adet (bir trader için en az bu kadar kapanan etiketli işlem yoksa model EĞİTİLMEZ)
ogrenme_filtre_egitim_gun: 3            # gün (model bu yaştan eskiyse saatlik adımda yeniden eğitilir; ayrıca haftalık kadro değişiminde zorla; 21 günlük son kullanmadan çok önce)
ogrenme_filtre_log_saat: 6              # saat (aynı trader için `ml_filtre_yok` kaydı en çok bu aralıkta bir)
sanal_ogrenme_drift_eylem: true        # bool, K-73: SANAL kipte CUSUM drift alarmı → filtre bir sonraki saatlik adımda yeniden eğitilir + kurulumun slot çarpanı min(mevcut, 0,5) (haftalık kadro değişiminde biter); olay `drift_eylem`
ogrenme_drift_telegram: false           # CUSUM drift Telegram UYARISI (varsayılan KAPALI: eşikler CT için kalibre değil; olay `kurulum_drift` + OZET karnesi yine yazılır)
# K-73/8 iz süren koruma (YALNIZ sanal kip): pozisyon kârı (girişe göre, yön + mark) zirvesi %15'e ulaşınca stop girişe (başa baş), %30'a ulaşınca +%15 kâra çekilir; kâr stopa inerse pozisyon kapanır (iz_suren_koruma). Sabit kâr al YOK; %20 felaket stopu aynen sürer
sanal_iz_suren: true                    # bool (gerçek kipte devre dışı)
iz_basabas_oran: 0.15                   # oran (zirve kâr bu kadar olunca stop = giriş)
iz_kilit_oran: 0.30                     # oran (zirve kâr bu kadar olunca stop = iz_kilit_seviye)
iz_kilit_seviye: 0.15                   # oran (kilit stopunun kâr seviyesi)
