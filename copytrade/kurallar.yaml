canli_kapanis_bantlari: [0.005, 0.01, 0.02, 0.02, 0.02]   # oran (kapanış yeniden deneme bantları, en çok 5 deneme; %2'ye yalnız DUR ve trader tam kapanışında çıkılır; K-37)
