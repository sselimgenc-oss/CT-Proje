canli_hl_sicrama_oran: 0.10            # oran (gerçek kip S-6: iki HL okuması arasında yerel defterle açıklanmayan özsermaye değişimi > kasa x bu → mutabakat bayrağı + alarm; o okumada risk/DUR bir okuma ertelenir)
canli_bekci_sn: 180                     # sn (G-12: dakikalık bakım bu süre boyunca tamamlanmazsa bekçi alarm verir ve süreç çıkış kodu 1 ile biter; systemd yeniden başlatır)

# T6 (K-37): seçim isabeti ölçümü (docs/RADAR_V1.md §7b; yalnız ölçer, radar_* eşiklerine dokunmaz)
