name: Canlı vardiya (sanal kip)

# T4 (docs/GOREV_T4_CANLI_MOTOR.md §3, K-29): sunucu açılana kadar canlı motor SANAL kipte GitHub Actions'ta vardiyalı koşar. GERÇEK KİP ASLA BURADA ÇALIŞMAZ: iş akışı HL anahtarı geçirmez ve
# motor `GITHUB_ACTIONS=true` iken `gercek` kipi reddeder. Cüzdan YOK; kasa `kurallar.yaml canli_kasa_usd` (kullanıcı ayarı, <= 1.000 $).
# Vardiya: 4 saatte bir tetiklenir (cron), her vardiya 4 sa 15 dk sürer; `concurrency` (kuyruk, iptal yok; üretim ve dal denemeleri ayrı grup) sayesinde yeni vardiya eskisi BİTTİKTEN sonra başlar (çift emir yok, boşluk yok);
# durum veri dalı `canli-durum` (dal doğrulamasında `canli-durum-deneme`): durum/*.json + kayit/<tarih>.jsonl; her 15 dk ve vardiya sonunda yayımlanır; yeni vardiya kaldığı yerden devam eder
# (açılışta kaçan dolumlar REST ile tamamlanır, `gec_goruldu`). Ek koruma: `durum/kilit.json` (başka vardiya 20 dk içinde nabız attıysa motor başlamaz).
# Dal doğrulaması: `copytrade/canli/CALISTIR` dosyasına satır eklenen push (main dışı dal) AYNI iş akışını koşturur, ama `canli-durum-deneme` dalına yazar ve kadroyu `radar-deneme`'den okur.
# G3 (cron geç kalıyor/kaçırıyor): motor NORMAL bitince vardiya bir SONRAKİ vardiyayı `workflow_dispatch` ile tetikler (yalnız main); cron'lar yedek olarak kalır. Dispatch koşusu da taze kilit varsa atlar.
# Zincir AYRI `zincir` işindedir (needs: vardiya, yalnız main; koşu kasıtlı İPTAL edilmediyse `!cancelled()` ile çalışır — vardiya hata/zaman aşımıyla bitse, pano/yayım/artifact adımı düşse de zincir sürer;
# hata döngüsü koruması: vardiya İŞİ 20 dk'dan genç bittiyse tetik YOK, yalnız alarm; checkout yok; Actions yazma izni yalnız orada): vardiya işindeki adımlar (kurulum, motor) bu yetkiyi görmez. Aynı işte vardiya sonu bir kez saglik.yml de tetiklenir.
# Zincir hatası ::warning + Telegram olur; yedek cron devam eder.
# G-23 (denetim 08.11): checkout'lar `persist-credentials: false` (token diske yazılmaz); veri dalı push kimliği yalnız yayım betiğine (`YAYIM_TOKEN`, motor süreci görmez).
# Cloudflare pano yayını AYRI `pano` işinde (contents: read; yayın aracı kilit dosyasından `npm ci`); yazma yetkili vardiya işi bu aracı çalıştırmaz, Cloudflare secret'larını görmez.
# Kullanıcı kararı 08.11: Telegram (bildirim, alarm, komut) varsayılan KAPALI — token yalnız repo değişkeni `TELEGRAM_ACIK=evet` iken verilir (Settings → Variables). Tokensiz kanal sessiz kapanır.
on:
  schedule:
    - cron: "7 */4 * * *"
    - cron: "37 */4 * * *"          # YEDEK (T6 §4): birincil tetiklenmezse; kilit taze ise (başka vardiya aktif) başlamaz — beklenen durum, "BAŞLAMADI" alarmı DEĞİL
  workflow_dispatch:
    inputs:
      sure_dk:
        description: "vardiya süresi (dakika); varsayılan ve üst sınır 255 (4 sa 15 dk)"
        default: "255"
  push:
    paths:
      - copytrade/canli/CALISTIR

permissions:
  contents: read                    # G-23: yazma yalnız `vardiya` işinde (iş düzeyinde)

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  # K-37 §8: üretim (main) ve dal denemeleri AYRI kuyruk; deneme vardiyası üretimi bekletmez (dal başına kendi kuyruğu).
  group: ${{ github.ref == 'refs/heads/main' && 'canli-vardiya-uretim' || format('canli-vardiya-deneme-{0}', github.ref_name) }}
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read                # O-2 (denetim #3): kontrol işi yazmaz (checkout + okuma + Telegram alarmı)
      actions: read                 # A-2 (b): kilit sahibi koşunun durumu (gh api, salt okur)
    outputs:
      atla: ${{ steps.k.outputs.atla }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: k
        name: Zamanlama kontrolü (yedek cron)
        env:
          VERI_DALI: ${{ github.ref == 'refs/heads/main' && 'canli-durum' || 'canli-durum-deneme' }}
          ZAMANLAMA: ${{ github.event.schedule }}
          YEDEK_CRON: "37 */4 * * *"
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/zamanlama_kontrol.sh canli
      - name: Alarm (Telegram, kontrol başarısız)
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ github.ref == 'refs/heads/main' && vars.TELEGRAM_ACIK == 'evet' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ github.ref == 'refs/heads/main' && vars.TELEGRAM_ACIK == 'evet' && secrets.TELEGRAM_CHAT_ID || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/vardiya_alarm.sh kontrol
  vardiya:
    needs: kontrol
    if: ${{ needs.kontrol.outputs.atla != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 290
    permissions:
      contents: write               # veri dalı yayımı (yalnız canli_yayimla.sh, YAYIM_TOKEN ile)
    env:
      VERI_DALI: ${{ github.ref == 'refs/heads/main' && 'canli-durum' || 'canli-durum-deneme' }}
      KADRO_DALI: ${{ github.ref == 'refs/heads/main' && 'radar' || 'radar-deneme' }}
      GIRDI_SURE_DK: ${{ inputs.sure_dk }}
      # B1 (Opus denetimi 05.11): Telegram yalnız main'de; deneme dalı token görmez (aynı bota iki getUpdates tüketicisi komut kaybettirir).
      TELEGRAM_BOT_TOKEN: ${{ github.ref == 'refs/heads/main' && vars.TELEGRAM_ACIK == 'evet' && secrets.TELEGRAM_BOT_TOKEN || '' }}
      TELEGRAM_CHAT_ID: ${{ github.ref == 'refs/heads/main' && vars.TELEGRAM_ACIK == 'evet' && secrets.TELEGRAM_CHAT_ID || '' }}
      # O-1 (G4/K1): repo değişkeni `TELEGRAM_KOMUT` (tanımsız = boş = komut alma AÇIK, mevcut davranış). Sunucu motoru devreye girince `kapali` yapılır (Telegram tek tüketici).
      TELEGRAM_KOMUT: ${{ vars.TELEGRAM_KOMUT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false  # G-23: yazma token'ı .git/config'e yazılmaz (kurulum/motor/pano adımları görmez)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install websockets==15.0.1 PyYAML==6.0.3 requests==2.34.2
      - id: geri
        name: Durumu veri dalından geri yükle (dönem kuralı)
        run: bash .github/scripts/donem_geri.sh
      - id: acilis
        name: Açılış kontrolü (anahtarsız, emir göndermez)
        run: python -u -m copytrade.canli.motor --kontrol --kadro-dali "$KADRO_DALI" --durum-dizin kontrol
      - id: sure
        name: Vardiya süresi (sınırlı)
        run: |
          # S-20: girdi (donem_geri.sh'ın kalan bütçesi DONEM_SURE_DK önce; yoksa dispatch `sure_dk`) sayı değilse 255; üst sınır 255 dk (iş zaman aşımı 290 dk: kurulum + son yayım payı); alt sınır 1 dk
          sure_dk="${DONEM_SURE_DK:-${GIRDI_SURE_DK:-255}}"
          case "$sure_dk" in ''|*[!0-9]*) sure_dk=255 ;; esac
          if [ "${#sure_dk}" -gt 4 ]; then sure_dk=9999; fi
          sure_dk=$((10#$sure_dk))
          if [ "$sure_dk" -gt 255 ]; then echo "::warning::sure_dk ${sure_dk} > 255: 255 dk'ya indirildi"; sure_dk=255; fi
          if [ "$sure_dk" -lt 1 ]; then sure_dk=1; fi
          echo "SURE_DK=${sure_dk}" >> "$GITHUB_ENV"
          echo "vardiya süresi: ${sure_dk} dk"
      - id: motor
        name: Canlı motor (sanal kip)
        env:
          YAYIM_TOKEN: ${{ github.token }}  # G-23: yalnız arka plan yayım betiğine; motor ve sağlık süreçleri `env -u` ile görmez
        run: |
          sure_dk="${SURE_DK:-255}"
          # 15 dk'da bir durumu veri dalına yayımlayan arka plan döngüsü (ayrı git worktree: motorun çalıştığı dizin değişmez)
          # Y-2 (denetim #3): yalnız main'de her turda SALT OKUR sağlık kontrolü (veri dalı + Cloudflare sayfası + REST); hata/zaman aşımı döngüyü ve motoru etkilemez
          yayim_dur="${RUNNER_TEMP:-/tmp}/canli_yayim_dur"
          rm -f "$yayim_dur"
          ( while [ ! -e "$yayim_dur" ] && sleep 900; do
              bash .github/scripts/canli_yayimla.sh || echo "yayım denemesi başarısız (döngü sürer)"
              if [ "${GITHUB_REF}" = refs/heads/main ]; then
                env -u YAYIM_TOKEN timeout 120 python -u -m copytrade.saglik --canli-url https://sg-pano.sselimgenc-c18.workers.dev/ --telegram || echo "sağlık kontrolü başarısız (döngü sürer)"
              fi
            done ) &
          yayim=$!
          set +e
          env -u YAYIM_TOKEN python -u -m copytrade.canli.motor --kip sanal --sanal-kasa-usd 600 --kadro-dali "$KADRO_DALI" --durum-dizin durum --kayit-dizin kayit --sure-sn "$((sure_dk * 60))" --vardiya "${GITHUB_RUN_ID}"
          cikis=$?
          # S-18: arka plan döngüsü durdurulur ama ÇALIŞAN yayım KESİLMEZ: dur dosyası + döngünün uyuyan `sleep` çocuğu öldürülür, çalışan yayım biter, sonra `wait` (en çok 15 dk).
          # Son yayım (sonraki adım) canli_yayimla.sh içindeki flock ile ayrıca sıraya girer (aynı anda iki yazar yok).
          touch "$yayim_dur"
          for _ in $(seq 1 900); do
            kill -0 "$yayim" 2>/dev/null || break
            pkill -P "$yayim" -x sleep 2>/dev/null
            sleep 1
          done
          if kill -0 "$yayim" 2>/dev/null; then echo "::warning::yayım döngüsü 15 dk'da bitmedi: durduruldu (son yayım kilidi bekler)"; kill "$yayim"; fi
          wait "$yayim"
          echo "arka plan yayım döngüsü bitti (çıkış $?)"
          set -e
          exit "$cikis"
      - name: Vardiya özeti
        if: ${{ always() && hashFiles('durum/ozet.json') != '' }}
        run: |
          {
            echo '### Canlı vardiya (sanal)'
            echo '```json'
            cat durum/ozet.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Günlük rapor (pano/OZET.md)
        if: ${{ always() && hashFiles('durum/ozet.json') != '' }}
        run: python -u -m copytrade.canli.pano --durum durum --kayit kayit --gecmis pano/gecmis.json --cikti pano/OZET.md --html pano/index.html --vardiya "${GITHUB_RUN_ID}" --isabet-dali "$KADRO_DALI"
      - name: Durumu veri dalına yaz
        if: ${{ always() }}
        env:
          YAYIM_TOKEN: ${{ github.token }}  # G-23: push kimliği yalnız yayım betiğine
        run: bash .github/scripts/canli_yayimla.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: canli-vardiya
          path: |
            durum/ozet.json
            durum/kontrol.json
            kontrol/kontrol.json
            kayit
          if-no-files-found: ignore
      - name: Alarm (Telegram, vardiya başarısız)
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ github.ref == 'refs/heads/main' && vars.TELEGRAM_ACIK == 'evet' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ github.ref == 'refs/heads/main' && vars.TELEGRAM_ACIK == 'evet' && secrets.TELEGRAM_CHAT_ID || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ADIM_GERI: ${{ steps.geri.outcome }}
          ADIM_ACILIS: ${{ steps.acilis.outcome }}
          ADIM_MOTOR: ${{ steps.motor.outcome }}
        run: bash .github/scripts/vardiya_alarm.sh vardiya
  pano:
    # G-23 (denetim 08.11): Cloudflare `sg-pano` yayını (K-40 ek) AYRI işte, vardiya ile PARALEL. Yazma izni YOK (contents: read; actions: read yalnız vardiya işinin durumunu okumak için).
    # Veri dalındaki `canli-durum:pano/index.html` dakikada bir okunur, değiştiyse yayımlanır; vardiya işi bitince son kez yayımlanır (pano_cf_yayimla.sh). Yalnız main.
    # Yayın aracı `.github/pano/package-lock.json`'dan `npm ci --ignore-scripts` ile kurulur (sürüm + bütünlük özeti sabit).
    needs: kontrol
    if: ${{ needs.kontrol.outputs.atla != 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Pano yayın aracını kilit dosyasından kur
        run: npm ci --prefix .github/pano --ignore-scripts --no-audit --no-fund
      - name: Pano yayını (Cloudflare, salt okur, vardiya ile paralel)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/pano_cf_yayimla.sh
  zincir:
    # G3: bir sonraki vardiyayı + sağlık kontrolünü tetikler. AYRI iş: Actions yazma izni ve token yalnız burada; checkout YOK (vardiya işindeki kurulum/yayın/motor adımları bu yetkiyi görmez).
    # Y-1 (denetim #3) + A-2 (c) (denetim 08.11): yalnız main'de; vardiya `success` OLMASA da çalışır — hata, ZAMAN AŞIMI (`cancelled` sonucu) dahil (zincir kopmaz; iz + alarm).
    # Çalışmadığı yalnız iki durum: koşu kasıtlı İPTAL edildi (`cancelled()`: kullanıcı durdurdu) ya da vardiya ATLANDI (taze kilit: `skipped`; sahte alarm/tetik olmasın).
    # (`!cancelled()` bu iş için bilinçli istisna; vardiya/kontrol işlerinde `always()` iş koşulunda yasak.)
    # Çift vardiya güvenliği: kontrol işindeki kilit kapısı + motor `kilit_al` + concurrency. HATA DÖNGÜSÜ KORUMASI: vardiya İŞİ 20 dk'dan genç bittiyse (motor hemen düştü) sonraki vardiya TETİKLENMEZ; yalnız alarm.
    # S-20: yaş = vardiya işinin başlangıcından (kuyruk süresi sayılmaz; koşunun `run_started_at`'i değil).
    needs: vardiya
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.vardiya.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VARDIYA_SONUC: ${{ needs.vardiya.result }}
      TELEGRAM_BOT_TOKEN: ${{ github.ref == 'refs/heads/main' && vars.TELEGRAM_ACIK == 'evet' && secrets.TELEGRAM_BOT_TOKEN || '' }}
      TELEGRAM_CHAT_ID: ${{ github.ref == 'refs/heads/main' && vars.TELEGRAM_ACIK == 'evet' && secrets.TELEGRAM_CHAT_ID || '' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Sonraki vardiya ve sağlık kontrolü tetikle
        run: |
          tg() {
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              if ! curl -fsS --max-time 30 --retry 2 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=$1" >/dev/null 2>&1; then
                echo "::warning::zincir alarmı gönderilemedi"
              fi
            fi
          }
          # A-2 (c): vardiya başarısız / zaman aşımı ile bittiyse zincir YİNE sürer; iz bırakılır. `cancelled` (zaman aşımı) için ayrıca alarm (başarısızlık alarmı vardiya işinde zaten var).
          sonuc="${VARDIYA_SONUC:-}"
          if [ -n "$sonuc" ] && [ "$sonuc" != success ]; then
            echo "::warning::vardiya işi '${sonuc}' sonuçlandı; zincir sürüyor"
            if [ "$sonuc" = cancelled ]; then tg "⚠️ Vardiya işi iptal/zaman aşımı ile bitti; zincir sürüyor (sonraki vardiya tetikleniyor): ${RUN_URL}"; fi
          fi
          # S-20: yaş (dk) = vardiya İŞİNİN başlangıcından (kuyruk beklemesi sayılmaz); okunamazsa 0 (güvenli yön: döngü korumasına girer, tetiklemez)
          yas_dk=0
          if basladi="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '[.jobs[] | select(.name == "vardiya")][0].started_at' 2>/dev/null)" && bs="$(date -u -d "$basladi" +%s 2>/dev/null)"; then
            yas_dk=$(( ($(date -u +%s) - bs) / 60 ))
          fi
          echo "vardiya işi yaşı: ${yas_dk} dk"
          if [ "$yas_dk" -lt 20 ]; then
            echo "::warning::vardiya 20 dk'dan kısa sürdü (${yas_dk} dk): hata döngüsü koruması, sonraki vardiya TETİKLENMEDİ (yedek cron / elle devam)"
            tg "⚠️ Vardiya ${yas_dk} dk'da bitti (hata döngüsü koruması): sonraki vardiya TETİKLENMEDİ, yedek cron / elle devam: ${RUN_URL}"
            exit 0
          fi
          for dosya in canli_vardiya.yml saglik.yml; do
            if gh workflow run "$dosya" --ref main; then
              echo "$dosya tetiklendi"
              continue
            fi
            echo "::warning::$dosya tetiklenemedi; yedek cron devrede"
            if [ "$dosya" = canli_vardiya.yml ]; then
              tg "⚠️ Vardiya zinciri: bir sonraki vardiya tetiklenemedi (yedek cron devrede): ${RUN_URL}"
            fi
          done
