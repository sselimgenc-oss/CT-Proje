name: Copy trade izleme (2 saatte bir)

# T1 (K-19): eski kadroyu izlediği için zamanlama (cron) KALDIRILDI; yalnız elle (workflow_dispatch) çalışır. Radar kadrosu için zamanlama T4'te geri gelir.
# İzlenen liste: `copytrade/izleme_listesi.yaml` (main).
# Sonuç: `copytrade-izleme:izleme/durum.json` (git geçmişi 2 saatlik sürümleri tutar); `motor.json` (ham dolum önbelleği) aynı dalda sıkıştırılmış: `izleme/motor.json.gz`.
# Telegram / Worker bu iş akışında YOK (K-13).
on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: copytrade-izleme
  cancel-in-progress: false

jobs:
  izleme:
    runs-on: ubuntu-latest
    # Sürekli bütçe < 120 dk (86 trader artımlı ≈ 84 dk, 5 trader 293 sn ölçüldü). İLK koşu her yeni kadro üyesi için 90 günlük dolum geçmişini çeker ve uzundur; yarıda kesilirse durum
    # yayımlanmaz ve sonraki koşu baştan dener, bu yüzden üst sınır geniş tutuldu: 86 trader ilk okuma ≈ 192 dk (deneme ölçümü, PR #468); GitHub sınırı 360 dk.
    # `concurrency` (cancel-in-progress: false) sayesinde uzun ilk koşu sırasında sonraki koşular kuyrukta bekler.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Durum arşivini geri yükle
        run: |
          mkdir -p izleme
          if git ls-remote --exit-code --heads origin copytrade-izleme >/dev/null; then
            git fetch origin copytrade-izleme
            git archive FETCH_HEAD izleme | tar -x
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
      - name: Motor durumunu veri dalındaki sıkıştırılmış dosyadan aç
        # `izleme/motor.json.gz` (K-20) yukarıda veri dalından geldi; yoksa (ilk koşu) motor sıfırdan başlar. Bozuk dosyada iş kırmızı biter (pipefail).
        run: |
          if [ -f izleme/motor.json.gz ]; then gunzip -c izleme/motor.json.gz > izleme/motor.json; fi
      - name: Halka açık veriyi oku ve sanal defteri güncelle
        # Tüm trader'lar hatalıysa motor yayımlamaz (RuntimeError) ve iş kırmızı biter; tek trader hatası önceki yükünü korur.
        run: python -m copytrade.izleme_motoru --root . --output izleme
      - name: Arşivi ayrı veri dalına yaz
        run: bash .github/scripts/izleme_yayimla.sh
