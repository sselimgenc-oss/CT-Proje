max_leverage: 15.0
# Martingale işareti (lider kararı 2026-10-26): en az 5 ekleme ve eklemelerin > %25'i zarardaki pozisyona
martingale_max_ratio: 0.25
martingale_min_additions: 5
# Lider kararı 2026-10-27 (ölçüm düzeltmesi): emir düzeyinde ve ortalama girişten > %2 aleyhte ekleme; kaldıraç = gerçek
# pozisyon değeri / hesap değeri (hesap ayarı değil)
martingale_min_adverse: 0.02
# Sanal kopya gecikmesi (dk; giriş ve çıkış dolumlarına; taker + kayma + funding dahil)
kopya_gecikme_dk:
  intraday: 30
  swing: 120
# Gölge V1: trader girişinden azami fiyat sapması.
golge_fiyat_bandi:
  intraday: 0.01
  swing: 0.02
# Gölge V2 (kullanıcı kararı 2026-10-28, dondu).
golge_v2:
  intraday:
    zarar_kes: -0.50
  swing:
    gun_0:
      zarar_kes: -0.50
      kar_al: null
    gun_7:
      zarar_kes: -0.30
      kar_al: 0.60
    gun_14:
      zarar_kes: -0.20
      kar_al: 0.40
golge_pozisyon_tavan_carpani: 3.0
# tutar_usd = sabit_tutar_ref_islem_usd × (clamp(kopya_hesabı_$, 1, sabit_tutar_tavan_kasa_usd) / sabit_tutar_ref_kasa_usd) ** sabit_tutar_us
sabit_tutar_ref_kasa_usd: 200.0
sabit_tutar_ref_islem_usd: 5.2
sabit_tutar_us: 0.86
sabit_tutar_tavan_kasa_usd: 10000.0
# HIP-3 coin → Binance USDⓈ-M sembolü (görev 9): `dex:` öneki atılır, ad aynı + USDT; yalnız farklı adlar burada.
# "var" yalnız Binance sembol listesinde (TradFi perp'ler dahil) bulunuyorsa.
binance_takma_ad:
  GOLD: XAU
  SILVER: XAG
  BRENTOIL: BZ
# Kopya maliyeti (her dolumda, notional'a oranla): taker %0,045 + kayma %0,05 (kullanıcı kararı)
maliyet_taker: 0.00045
maliyet_kayma: 0.0005
mum_uzaklik_max_aralik: 1
# Akıl sağlığı: oran/düşüş sütunları 0–1, kaldıraç 0–saglik_max_kaldirac; sabit sütun kontrolü en az bu kadar satırda
saglik_max_kaldirac: 200
# İşaret yaşı (E4): açık pozisyon bundan eski bir mumla işaretlenmez (mark_missing; sonuç "eksik işaretleme" notu taşır). 1 saatlik mum + tolerans.
isaret_yas_max_dk: 120
# Pozisyon mutabakatı (A13, copytrade/pozisyon_mutabakat.py): defter ↔ clearinghouseState tolerans eşiği = max(mutlak, göreli × |defter|); yalnız rapor
mutabakat_goreli_tolerans: 0.01
mutabakat_mutlak_tolerans: 1.0e-06
# Mum akıl sağlığı (A15, copytrade/mum_saglik.py): sıçrama = açılış, önceki geçerli mumların kapanış medyanından oranla (max(o/med, med/o)) bu kat ve üstü uzak
mum_sicrama_kat: 2.0
mum_medyan_pencere: 24
# Gölge likidasyonu (copytrade/golge.py): trader'ın açık pozisyonlarının TOPLAM (çapraz teminat) ya da tek pozisyonun ayrılmış 1 birime oranlı K/Z'si bu değere ya da altına inerse tasfiye
golge_likidasyon_esigi: -1.0
# Dolum sayfalaması (copytrade/tarama.py PublicClient.fills): userFillsByTime sayfa boyutu (API sınırı)
api_sayfa_boyutu_dolum: 2000
# Sağlık ışığında performans konisi (koni, düşüş, CUSUM). false = kör mod (K-6 b). Ön kayıt 1.5 (kullanıcı, 2026-10-29): körlük kalktı → true
saglik_performans_konisi: true
# Mutabakat sağlık ışığı : yalnız rapor uyarısı, karar değildir.
mutabakat_saglik_sari_uyumsuz_oran: 0.01
mutabakat_saglik_kirmizi_uyumsuz_oran: 0.10
mutabakat_saglik_hesap_degeri_sicrama_oran: 0.25
# Veri tazeliği (dk): `bayat_isle`: veri_zamani yayın anından bu dakikadan eskiyse trader `bayat` (270 = 2 × 120 dk koşu aralığı + 30 dk tampon; bir koşu kaçsa bile bayat sayılmaz).
veri_tazelik_dk: 270
kapanan_islem_pencere_gun: 30
# `durum.json` (yayın) trader başına `sanal_kopya_v3.kapanan_islemler`: son `kapanan_islem_pencere_gun` gün + (pencereden eski olsa da) en az son bu kadar
# GEÇERLİ işlem (son 6 geçerli işlem). TAM geçmiş `motor.json`'da silinmeden kalır.
kapanan_islem_min_gecerli: 6
# H5 (docs/GOREV_H5_RISK.md): anlık kopya risk sınırları, DRY-RUN varsayılanları (lider kararı; canlı sayıları H4'te kullanıcı onaylar).
# Birimler: *_usd = 1.000 $ sanal kopya ölçeğinde notional ($); sinyal_tazelik_sn = saniye (dolum zamanı -> karar anı).
risk_dry_run:
  referans_kasa_usd: 1000.0
  emir_tavan_usd: 100.0
  trader_tavan_usd: 200.0
  toplam_brut_tavan_usd: 1500.0
  gunluk_zarar_usd: 30.0
  sinyal_tazelik_sn: 10
  dur_dosyasi: "$STATE_DIRECTORY/DUR"
# ---- Radar v1 (docs/RADAR_V1.md §2–3; T2: R0 evren + R1 kopyalanabilirlik). Eşikler v1'de donar; kodda sayı sabiti yok.
# Birimler: *_usd = trader hesabı ölçeği ($, trader_$) — radar_likit_coin_hacim_usd coin 24 sa nosyonel hacmi ($); oranlar kesirdir (0,25 = %25); süre saat/dakika adıyla.
radar_min_hesap_usd: 10000              # trader_$ (hafta başı sermaye = accountValue − hafta pnl; K-31)
radar_aday_tavan: 300                   # kişi (7 gün getiriye göre ilk N; K-31)
radar_pencere_saat: 168                 # saat (son7g)
radar_min_islem: 10                     # kapanmış round trip, sınır dahil
radar_min_medyan_tutma_saat: 1.0        # saat, sınır dahil
radar_kisa_islem_dk: 5                  # dakika (bundan KISA tutma "kısa işlem")
radar_kisa_islem_payi_max: 0.25         # oran, sınır dahil
radar_max_kaldirac: 20.0                # x, sınır dahil
radar_likit_coin_hacim_usd: 1000000     # $ (coin 24 sa nosyonel hacmi, metaAndAssetCtxs.dayNtlVlm), sınır dahil
radar_likit_pay_min: 0.80               # oran (nosyonel), sınır dahil
radar_kopya_gecikme_dk: 1               # dakika (kopya oynatma gecikmesi)
radar_kopya_koruma_min: 0.50            # oran (kopya getirisi / trader getirisi), sınır dahil
radar_max_devir_hafta: 100              # kat (hafta vlm / accountValue), sınır dahil
radar_bootstrap_tekrar: 1000            # tekrar (tohum adresten türetilir: aynı girdi aynı sonuç)
radar_bootstrap_alt_yuzdelik: 0.20      # oran (alt yüzdelik)
radar_akil_sagligi_getiri_max: 3.0      # oran (+%300), üstü veri hatası şüphesi
radar_dolum_tavan: 5000                 # dolum (7 günde bu kadar ya da fazlası = ≈ 2 dk'da bir dolum: kopyalanamaz; `dolum_fazla`, kopya oynatılmaz, dolum alanları null)
radar_api_agirlik_dk: 1100              # ağırlık/dk (radar istemcisi hız sınırı; HL IP sınırı 1.200)
radar_zaman_butcesi_dk: 120             # dakika (koşu süresi; aşılınca kalan adaylar `zaman_yok`)
