name: Sağlık kontrolü (motor, radar, pano)

# Kullanıcı kararı 2026-11-05 ("Bilgi İşlem + Denetim ekibi"): saatte bir motorun/radarın/panonun çalışıp çalışmadığını SALT OKUR kontrol eder (copytrade/saglik.py) ve sorun varsa Telegram'a alarm yollar.
# Veri dallarını (canli-durum, radar) YALNIZ okur; hiçbir dala yazmaz, emir/anahtar yok (yalnız Telegram secret'ları). KRITIK bulguda iş kırmızı biter (görünür). Strateji/eşik değişmez.
# O-2 (denetim #3): `--gercek-dali` bayrağı BİLEREK yok (K2 kararı bekliyor: gerçek kip dalı yayını). Gerçek kip açılmadan eklenirse `gercek_kontrol` her saat yanlış KRİTİK üretir. Sıra: K2 → dal yayını → bayrak.
# Not: GitHub cron'u bazen geç/hiç tetiklenir (2026-11-05 gözlemi); bu iş akışı çalışmazsa pano üstündeki "VERİ BAYAT" uyarısı (tarayıcıda) ikinci güvenlik ağıdır.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: saglik
  cancel-in-progress: false

jobs:
  saglik:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install requests==2.34.2 PyYAML==6.0.3
      - name: Veri dallarını al
        run: git fetch origin canli-durum radar
      - name: Sağlık kontrolü
        env:
          TELEGRAM_BOT_TOKEN: ${{ github.ref == 'refs/heads/main' && vars.TELEGRAM_ACIK == 'evet' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ github.ref == 'refs/heads/main' && vars.TELEGRAM_ACIK == 'evet' && secrets.TELEGRAM_CHAT_ID || '' }}
        run: python -u -m copytrade.saglik --veri-dali canli-durum --kadro-dali radar --canli-url "https://sg-pano.sselimgenc-c18.workers.dev/" --telegram | tee -a "$GITHUB_STEP_SUMMARY"
