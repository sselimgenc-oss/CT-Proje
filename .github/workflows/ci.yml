name: PR kontrolu

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Run unit and specification tests
        run: python -m pytest -q

  canli_sdk:
    # G-22: sunucu sanal ortamı kilitli listeden (hash zorunlu) kurulur; SDK ağsız kablo biçimi testi (Cloid, emir kablosu, imza, Exchange(timeout=))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked live dependencies (require hashes)
        run: |
          python -m venv /tmp/canli
          /tmp/canli/bin/pip install --require-hashes -r requirements-canli.lock
          /tmp/canli/bin/pip check
      - name: Install test runner
        run: /tmp/canli/bin/pip install pytest==9.1.1
      - name: Offline SDK wire-format test
        env:
          SDK_ZORUNLU: "1"
        run: /tmp/canli/bin/python -m pytest -q tests/test_sdk_kablo.py
